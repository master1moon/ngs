<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>اختبار شامل - محاكاة إضافة البيانات</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .log { background: #f5f5f5; padding: 10px; margin: 10px 0; border-radius: 5px; font-family: monospace; white-space: pre-wrap; max-height: 400px; overflow-y: auto; }
        .success { color: green; }
        .error { color: red; }
        .warning { color: orange; }
        .info { color: blue; }
        button { margin: 5px; padding: 8px 15px; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .test-pass { background: #d4edda; border-left: 4px solid #28a745; }
        .test-fail { background: #f8d7da; border-left: 4px solid #dc3545; }
    </style>
</head>
<body>
    <h1>🧪 اختبار شامل - محاكاة إضافة البيانات وتحديث الصفحة</h1>
    
    <div class="section">
        <h3>📋 قائمة الاختبارات</h3>
        <button onclick="testDataPersistence()">اختبار استمرارية البيانات</button>
        <button onclick="testAddPackage()">اختبار إضافة باقة</button>
        <button onclick="testAddStore()">اختبار إضافة محل</button>
        <button onclick="testAddExpense()">اختبار إضافة مصروف</button>
        <button onclick="testAddSale()">اختبار إضافة بيع</button>
        <button onclick="testAddPayment()">اختبار إضافة تسديد</button>
        <button onclick="testPageRefresh()">اختبار تحديث الصفحة</button>
        <button onclick="runFullTest()">تشغيل جميع الاختبارات</button>
        <button onclick="clearLog()">مسح السجل</button>
    </div>
    
    <div id="log" class="log"></div>

    <script>
        let testCount = 0;
        let passCount = 0;
        let failCount = 0;
        
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString('ar-SA');
            const className = type === 'error' ? 'error' : type === 'success' ? 'success' : type === 'warning' ? 'warning' : 'info';
            logDiv.innerHTML += `<span class="${className}">[${timestamp}] ${message}</span>\n`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function testResult(testName, passed, details = '') {
            testCount++;
            if (passed) {
                passCount++;
                log(`✅ ${testName}: نجح`, 'success');
            } else {
                failCount++;
                log(`❌ ${testName}: فشل - ${details}`, 'error');
            }
        }

        // محاكاة البيانات
        let mockData = {
            packages: [],
            inventory: [],
            stores: [],
            expenses: [],
            sales: [],
            payments: [],
            trash: []
        };

        function testDataPersistence() {
            log('🔄 بدء اختبار استمرارية البيانات...');
            
            try {
                // اختبار 1: حفظ البيانات
                const testData = {
                    packages: [{ id: 'test1', name: 'باقة اختبار', price: 100 }],
                    stores: [{ id: 'store1', name: 'محل اختبار' }]
                };
                
                localStorage.setItem('networkCardsData', JSON.stringify(testData));
                testResult('حفظ البيانات في localStorage', true);
                
                // اختبار 2: استرجاع البيانات
                const retrieved = localStorage.getItem('networkCardsData');
                const parsed = JSON.parse(retrieved);
                
                if (parsed && parsed.packages && parsed.packages.length > 0) {
                    testResult('استرجاع البيانات من localStorage', true);
                } else {
                    testResult('استرجاع البيانات من localStorage', false, 'البيانات غير موجودة');
                }
                
                // اختبار 3: تحليل البيانات
                if (parsed.packages[0].name === 'باقة اختبار') {
                    testResult('تحليل البيانات المحفوظة', true);
                } else {
                    testResult('تحليل البيانات المحفوظة', false, 'البيانات غير صحيحة');
                }
                
            } catch (error) {
                testResult('استمرارية البيانات', false, error.message);
            }
        }

        function testAddPackage() {
            log('🔄 بدء اختبار إضافة باقة...');
            
            try {
                const packageData = {
                    id: 'pkg_' + Date.now(),
                    name: 'باقة اختبار',
                    price: 150,
                    createdAt: new Date().toISOString().slice(0, 10)
                };
                
                // محاكاة إضافة الباقة
                mockData.packages.push(packageData);
                
                // اختبار حفظ البيانات
                localStorage.setItem('networkCardsData', JSON.stringify(mockData));
                
                // اختبار استرجاع البيانات
                const retrieved = JSON.parse(localStorage.getItem('networkCardsData'));
                const addedPackage = retrieved.packages.find(p => p.id === packageData.id);
                
                if (addedPackage && addedPackage.name === 'باقة اختبار') {
                    testResult('إضافة باقة جديدة', true);
                } else {
                    testResult('إضافة باقة جديدة', false, 'الباقة غير موجودة في البيانات المحفوظة');
                }
                
            } catch (error) {
                testResult('إضافة باقة', false, error.message);
            }
        }

        function testAddStore() {
            log('🔄 بدء اختبار إضافة محل...');
            
            try {
                const storeData = {
                    id: 'store_' + Date.now(),
                    name: 'محل اختبار',
                    location: 'موقع اختبار',
                    createdAt: new Date().toISOString().slice(0, 10)
                };
                
                // محاكاة إضافة المحل
                mockData.stores.push(storeData);
                
                // اختبار حفظ البيانات
                localStorage.setItem('networkCardsData', JSON.stringify(mockData));
                
                // اختبار استرجاع البيانات
                const retrieved = JSON.parse(localStorage.getItem('networkCardsData'));
                const addedStore = retrieved.stores.find(s => s.id === storeData.id);
                
                if (addedStore && addedStore.name === 'محل اختبار') {
                    testResult('إضافة محل جديد', true);
                } else {
                    testResult('إضافة محل جديد', false, 'المحل غير موجود في البيانات المحفوظة');
                }
                
            } catch (error) {
                testResult('إضافة محل', false, error.message);
            }
        }

        function testAddExpense() {
            log('🔄 بدء اختبار إضافة مصروف...');
            
            try {
                const expenseData = {
                    id: 'exp_' + Date.now(),
                    type: 'كهرباء',
                    amount: 200,
                    date: new Date().toISOString().slice(0, 10),
                    description: 'مصروف اختبار',
                    createdAt: new Date().toISOString().slice(0, 10)
                };
                
                // محاكاة إضافة المصروف
                mockData.expenses.push(expenseData);
                
                // اختبار حفظ البيانات
                localStorage.setItem('networkCardsData', JSON.stringify(mockData));
                
                // اختبار استرجاع البيانات
                const retrieved = JSON.parse(localStorage.getItem('networkCardsData'));
                const addedExpense = retrieved.expenses.find(e => e.id === expenseData.id);
                
                if (addedExpense && addedExpense.amount === 200) {
                    testResult('إضافة مصروف جديد', true);
                } else {
                    testResult('إضافة مصروف جديد', false, 'المصروف غير موجود في البيانات المحفوظة');
                }
                
            } catch (error) {
                testResult('إضافة مصروف', false, error.message);
            }
        }

        function testAddSale() {
            log('🔄 بدء اختبار إضافة بيع...');
            
            try {
                const saleData = {
                    id: 'sale_' + Date.now(),
                    storeId: 'store_' + Date.now(),
                    packageId: 'pkg_' + Date.now(),
                    quantity: 5,
                    price: 150,
                    date: new Date().toISOString().slice(0, 10),
                    createdAt: new Date().toISOString().slice(0, 10)
                };
                
                // محاكاة إضافة البيع
                mockData.sales.push(saleData);
                
                // اختبار حفظ البيانات
                localStorage.setItem('networkCardsData', JSON.stringify(mockData));
                
                // اختبار استرجاع البيانات
                const retrieved = JSON.parse(localStorage.getItem('networkCardsData'));
                const addedSale = retrieved.sales.find(s => s.id === saleData.id);
                
                if (addedSale && addedSale.quantity === 5) {
                    testResult('إضافة بيع جديد', true);
                } else {
                    testResult('إضافة بيع جديد', false, 'البيع غير موجود في البيانات المحفوظة');
                }
                
            } catch (error) {
                testResult('إضافة بيع', false, error.message);
            }
        }

        function testAddPayment() {
            log('🔄 بدء اختبار إضافة تسديد...');
            
            try {
                const paymentData = {
                    id: 'pay_' + Date.now(),
                    storeId: 'store_' + Date.now(),
                    amount: 300,
                    date: new Date().toISOString().slice(0, 10),
                    description: 'تسديد اختبار',
                    createdAt: new Date().toISOString().slice(0, 10)
                };
                
                // محاكاة إضافة التسديد
                mockData.payments.push(paymentData);
                
                // اختبار حفظ البيانات
                localStorage.setItem('networkCardsData', JSON.stringify(mockData));
                
                // اختبار استرجاع البيانات
                const retrieved = JSON.parse(localStorage.getItem('networkCardsData'));
                const addedPayment = retrieved.payments.find(p => p.id === paymentData.id);
                
                if (addedPayment && addedPayment.amount === 300) {
                    testResult('إضافة تسديد جديد', true);
                } else {
                    testResult('إضافة تسديد جديد', false, 'التسديد غير موجود في البيانات المحفوظة');
                }
                
            } catch (error) {
                testResult('إضافة تسديد', false, error.message);
            }
        }

        function testPageRefresh() {
            log('🔄 بدء اختبار تحديث الصفحة...');
            
            try {
                // حفظ بيانات اختبارية
                const testData = {
                    packages: [{ id: 'refresh_test', name: 'باقة اختبار التحديث', price: 100 }],
                    stores: [{ id: 'refresh_store', name: 'محل اختبار التحديث' }],
                    expenses: [{ id: 'refresh_exp', type: 'كهرباء', amount: 200 }],
                    sales: [{ id: 'refresh_sale', storeId: 'refresh_store', packageId: 'refresh_test', quantity: 3 }],
                    payments: [{ id: 'refresh_pay', storeId: 'refresh_store', amount: 150 }],
                    inventory: [],
                    trash: []
                };
                
                localStorage.setItem('networkCardsData', JSON.stringify(testData));
                
                // محاكاة تحميل البيانات بعد التحديث
                const loadedData = JSON.parse(localStorage.getItem('networkCardsData'));
                
                // اختبار استمرارية البيانات بعد التحديث
                let allDataIntact = true;
                let missingItems = [];
                
                if (!loadedData.packages.find(p => p.id === 'refresh_test')) {
                    allDataIntact = false;
                    missingItems.push('الباقة');
                }
                
                if (!loadedData.stores.find(s => s.id === 'refresh_store')) {
                    allDataIntact = false;
                    missingItems.push('المحل');
                }
                
                if (!loadedData.expenses.find(e => e.id === 'refresh_exp')) {
                    allDataIntact = false;
                    missingItems.push('المصروف');
                }
                
                if (!loadedData.sales.find(s => s.id === 'refresh_sale')) {
                    allDataIntact = false;
                    missingItems.push('البيع');
                }
                
                if (!loadedData.payments.find(p => p.id === 'refresh_pay')) {
                    allDataIntact = false;
                    missingItems.push('التسديد');
                }
                
                if (allDataIntact) {
                    testResult('استمرارية البيانات بعد تحديث الصفحة', true);
                } else {
                    testResult('استمرارية البيانات بعد تحديث الصفحة', false, `البيانات المفقودة: ${missingItems.join(', ')}`);
                }
                
            } catch (error) {
                testResult('تحديث الصفحة', false, error.message);
            }
        }

        function runFullTest() {
            log('🚀 بدء الاختبار الشامل...');
            testCount = 0;
            passCount = 0;
            failCount = 0;
            
            setTimeout(() => {
                testDataPersistence();
                
                setTimeout(() => {
                    testAddPackage();
                    
                    setTimeout(() => {
                        testAddStore();
                        
                        setTimeout(() => {
                            testAddExpense();
                            
                            setTimeout(() => {
                                testAddSale();
                                
                                setTimeout(() => {
                                    testAddPayment();
                                    
                                    setTimeout(() => {
                                        testPageRefresh();
                                        
                                        setTimeout(() => {
                                            log(`📊 نتائج الاختبار الشامل:`, 'info');
                                            log(`- إجمالي الاختبارات: ${testCount}`, 'info');
                                            log(`- الاختبارات الناجحة: ${passCount}`, passCount === testCount ? 'success' : 'warning');
                                            log(`- الاختبارات الفاشلة: ${failCount}`, failCount === 0 ? 'success' : 'error');
                                            
                                            if (failCount === 0) {
                                                log('🎉 جميع الاختبارات نجحت! النظام يعمل بشكل مثالي', 'success');
                                            } else {
                                                log('⚠️ توجد اختبارات فاشلة تحتاج إلى معالجة', 'warning');
                                            }
                                        }, 1000);
                                    }, 1000);
                                }, 1000);
                            }, 1000);
                        }, 1000);
                    }, 1000);
                }, 1000);
            }, 500);
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
            testCount = 0;
            passCount = 0;
            failCount = 0;
            log('تم مسح السجل', 'info');
        }

        // مراقبة الأخطاء
        window.addEventListener('error', function(event) {
            log(`❌ خطأ غير معالج: ${event.message} في ${event.filename}:${event.lineno}`, 'error');
        });

        window.addEventListener('unhandledrejection', function(event) {
            log(`❌ Promise مرفوض: ${event.reason}`, 'error');
        });

        // اختبار تلقائي عند التحميل
        document.addEventListener('DOMContentLoaded', function() {
            log('🚀 تم تحميل صفحة الاختبار', 'success');
            
            setTimeout(() => {
                log('🔍 بدء الاختبارات التلقائية...');
                testDataPersistence();
                
                setTimeout(() => {
                    log(`📊 نتائج الاختبارات التلقائية:`, 'info');
                    log(`- إجمالي الاختبارات: ${testCount}`, 'info');
                    log(`- الاختبارات الناجحة: ${passCount}`, passCount === testCount ? 'success' : 'warning');
                    log(`- الاختبارات الفاشلة: ${failCount}`, failCount === 0 ? 'success' : 'error');
                }, 2000);
            }, 1000);
        });
    </script>
</body>
</html>
